name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker image ke andar build hota hai - toolchain preinstalled & matched
      - name: Build with Buildozer
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: master

      # APK upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pubg-launcher-apk
          path: bin/*.apk
          if-no-files-found: error

      # FULL log upload - agar fail ho to humein asli error milega
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/dists/*/build.log
          if-no-files-found: ignore

